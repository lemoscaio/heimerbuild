name: E2E

on:
  pull_request:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on the host runner: the Playwright image has no gh or jq for find-preview-url.sh.
  prepare:
    name: e2e prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            bun.lock
          sparse-checkout-cone-mode: false
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(grep -oE '"@playwright/test@[^"]+"' bun.lock | head -n 1 | tr -d '"' | cut -d @ -f 3)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Wait for the Cloudflare preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/find-preview-url.sh

  e2e:
    name: e2e
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The image ships the browsers and their OS deps, so nothing comes from apt. Its tag is
    # read from bun.lock, so it always matches @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.prepare.outputs.playwright }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      # oven-sh/setup-bun needs unzip, which the image lacks; npm ships the same binary.
      - name: Install Bun
        run: npm install -g --no-fund --no-audit "bun@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - run: bun install --frozen-lockfile
      # Without BASE_URL, playwright.config.ts runs `bun run build && bun run preview:local`.
      - name: Run the flows
        env:
          BASE_URL: ${{ needs.prepare.outputs.url }}
        run: bun run e2e
      - name: Upload the Playwright trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: |
            test-results/
            playwright-report/
          retention-days: 14
