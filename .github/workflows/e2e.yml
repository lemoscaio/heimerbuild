name: E2E

on:
  pull_request:
  # Runs on main only to save the browser cache, which PR runs can restore but not share.
  push:
    branches: [main]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(grep -oE '"@playwright/test@[^"]+"' bun.lock | head -n 1 | tr -d '"' | cut -d @ -f 3)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: "DEMO (throwaway): kill attempt 1 mid-apt"
        run: bash .github/demo/inject-apt-fault.sh
      # A stuck apt mirror once hung this step until the 25-minute job timeout (PR 168):
      # each attempt now times out on its own and retries once.
      - name: Install Chromium
        timeout-minutes: 10
        env:
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: bash .github/scripts/install-chromium.sh
      - name: Wait for the Cloudflare preview
        if: github.event_name == 'pull_request'
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/find-preview-url.sh
      # Without BASE_URL, playwright.config.ts runs `bun run build && bun run preview:local`.
      - name: Run the flows
        if: github.event_name == 'pull_request'
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
        run: bun run e2e
      - name: Upload the Playwright trace
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: |
            test-results/
            playwright-report/
          retention-days: 14
